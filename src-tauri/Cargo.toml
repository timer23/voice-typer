[package]
name = "voice-typer"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "voice_typer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "voice-typer"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Аудио запись
cpal = "0.15"
hound = "3.5"

# HTTP клиент для API
reqwest = { version = "0.12", features = ["json", "multipart"] }

# Буфер обмена и ввод
clipboard-rs = "0.2"
enigo = "0.3"

# Утилиты
tokio = { version = "1", features = ["full"] }
anyhow = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic = "abort"
strip = true
lto = false
opt-level = 2
codegen-units = 1
